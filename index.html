<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>ImpermeApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: client app = full-window mobile app (content in a centered column on wide screens);
   admin panel = full-page back-office with a dark sidebar on wide screens and a bottom tab bar on phones.
   Deliberately a single light look (the brand's water palette), so every color is set explicitly. */
:root{
  --mist:#F2F8FC; --foam:#E4F1F9; --drop:#5DB7E5; --sea:#2C8CC0; --deep:#17628E; --ink:#0E2A3B; --ink2:#173A50; --slate:#3E5A6B;
  --muted:#566F7F; --line:#CFE2EE; --field:#FAFCFD; --white:#FFFFFF; --frame:#DCEAF3; --ok:#1F7A4D; --okbg:#E1F4EA;
  --amber:#9A5B0C; --amberbg:#FDF1DD; --danger:#B3261E; --dangerbg:#FCE4E2; --scrim:rgba(14,42,59,.45); --onink:#DCEAF3;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--frame);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:3px solid var(--drop);outline-offset:2px}

/* The client app fills the whole window. Bars span the full width; on wide screens their content stays in a centered 560px column. */
.wrap{height:100%;--gx:max(20px,env(safe-area-inset-left,0px),calc((100% - 560px) / 2));--hx:max(12px,env(safe-area-inset-left,0px),calc((100% - 600px) / 2))}
.app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--white)}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--white);transition:transform .34s var(--ease),opacity .34s var(--ease)}
.screen.enter-r{transform:translateX(40px);opacity:0}
.screen.enter-l{transform:translateX(-40px);opacity:0}
.splash{align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px;font-weight:600}
.splash h2{margin:0;color:var(--ink);font-size:26px;font-weight:800}
.hdr{height:56px;display:flex;align-items:center;gap:10px;padding-inline:var(--hx);border-bottom:1px solid var(--line);flex-shrink:0}
.hdr h1{font-size:17px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;flex-shrink:0;position:relative}
.ib:hover{background:var(--foam)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.body{flex:1;overflow-y:auto;padding-block:16px 18px;padding-inline:var(--gx);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.foot{padding-block:10px 18px;padding-inline:var(--gx);display:grid;gap:10px;flex-shrink:0;background:var(--white)}
.steps{display:flex;gap:6px;margin:2px 0 6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--foam)}
.steps i.on{background:var(--drop)}
.kicker{font-size:12px;color:var(--muted);font-weight:600}
.lbl{display:block;font-size:13.5px;font-weight:700;margin:18px 0 8px}
.lbl.first{margin-top:10px}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.err{font-size:12.5px;color:var(--danger);margin-top:6px;font-weight:600}

.btn{height:52px;border-radius:14px;border:1.5px solid var(--deep);background:var(--sea);color:var(--white);font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s;text-decoration:none;padding:0 16px;text-align:center}
.btn:hover{background:var(--deep)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--white);color:var(--ink);border-color:var(--ink)}
.btn.sec:hover{background:var(--mist)}
.btn.wa{background:var(--ok);border-color:var(--ok)}
.btn.danger{background:var(--white);color:var(--danger);border-color:var(--danger)}
.btn[aria-disabled="true"],.btn:disabled{background:var(--foam);border-color:var(--line);color:var(--muted);transform:none}
.btn.sm{height:42px;font-size:14px;border-radius:12px}
.btn.xs{height:34px;font-size:13px;border-radius:10px;padding:0 12px;border-width:1px}
.link{border:0;background:none;color:var(--sea);font-weight:700;font-size:13px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.linkrow{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.newdot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:99px;background:var(--danger);border:2px solid var(--white)}

.inp{width:100%;height:46px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:0 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:96px;padding:12px 14px;resize:none;line-height:1.4}
.inp:focus{border-color:var(--drop);box-shadow:0 0 0 4px rgba(93,183,229,.18)}
.inp.bad{border-color:var(--danger)}
.inp[readonly]{color:var(--muted)}
.fl{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600}

.opt{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--white);border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s,background .2s}
.opt b{display:block;font-size:14.5px}
.opt span.s{font-size:12px;color:var(--muted)}
.opt .mk{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--ink);flex-shrink:0;display:grid;place-items:center;transition:all .2s}
.opt.sq .mk{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--sea);background:var(--mist)}
.opt[aria-checked="true"] .mk{border-color:var(--sea);background:var(--sea)}
.opt[aria-checked="true"] .mk::after{content:"";width:8px;height:8px;border-radius:9px;background:var(--white)}
.opt.sq[aria-checked="true"] .mk::after{width:10px;height:6px;border-radius:0;background:none;border:2.5px solid var(--white);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt:disabled{opacity:.5}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;border-radius:99px;border:1.5px solid var(--line);background:var(--white);padding:0 14px;font-size:13.5px;font-weight:600;transition:all .2s;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--sea);background:var(--foam);color:var(--deep)}

.upl{position:relative;border:1.5px dashed var(--line);border-radius:16px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--slate);font-size:13px;background:var(--mist);transition:border-color .2s;cursor:pointer}
.upl:hover{border-color:var(--drop)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.th{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:12px;background:var(--foam);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:#AFC6D4;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .rm{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(14,42,59,.75);color:var(--white);display:grid;place-items:center}
.th .rm .ico{width:14px;height:14px;stroke-width:2.6}

/* welcome */
.hero{text-align:center;padding-top:30px}
.hero h2{font-size:34px;font-weight:800;margin:14px 0 8px;letter-spacing:-.02em}
.hero p{color:var(--slate);font-size:15px;line-height:1.5;margin:0 auto;max-width:280px}
.howto{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:16px}
.howto li{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600}
.howto b{width:30px;height:30px;border-radius:99px;background:var(--foam);color:var(--deep);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.dropfall{animation:fall .9s var(--ease) both}
@keyframes fall{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.active{margin-top:26px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--mist);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.active .grow{flex:1;min-width:0}
.active b{display:block;font-size:14.5px}
.msgnote{margin-top:10px;width:100%;text-align:left;border:1.5px solid var(--sea);background:var(--white);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.msgnote i{width:10px;height:10px;border-radius:99px;background:var(--danger);flex-shrink:0}

/* orientation */
.ocard{background:var(--mist);border:1px solid var(--line);border-radius:18px;padding:16px}
.pills{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:26px;border-radius:99px;padding:0 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.b{background:var(--foam);color:var(--deep)}
.pill.u1{background:var(--okbg);color:var(--ok)}
.pill.u2{background:var(--amberbg);color:var(--amber)}
.pill.u3{background:var(--dangerbg);color:#9C2A20}
.pill.n{background:var(--mist);color:var(--slate);border:1px solid var(--line)}
.ocard h3{font-size:13px;margin:16px 0 4px}
.ocard p{margin:0;font-size:14.5px;line-height:1.5}
.tips{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
.tips li{display:flex;gap:10px;font-size:14px;line-height:1.4}
.tips li i{width:20px;height:20px;border-radius:99px;background:var(--drop);flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.tips li i::after{content:"";width:8px;height:4.5px;border:2px solid var(--white);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.note{display:flex;gap:8px;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.45}

/* calendar (client) */
.calh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px}
.calnav{display:flex;align-items:center;gap:2px}
.calnav b{font-size:13.5px;min-width:112px;text-align:center}
.calnav .ib{width:34px;height:34px}
.calnav .ib[disabled]{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dn{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
.day{height:40px;border-radius:11px;border:0;background:transparent;font-size:14px;color:#A9B8C1;padding:0}
.day.av{background:var(--mist);border:1.5px solid var(--line);color:var(--ink);font-weight:700}
.day.av:hover{border-color:var(--drop)}
.day.sel{background:var(--sea);border-color:var(--sea);color:var(--white)}
.day.today{box-shadow:inset 0 -3px 0 var(--drop)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.slot{display:flex;justify-content:space-between;width:100%}
.slot em{font-style:normal;color:var(--muted);font-size:13px}

/* service */
.stat{display:flex;justify-content:space-between;align-items:center}
.badge{height:26px;border-radius:99px;padding:0 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:var(--okbg);color:var(--ok);white-space:nowrap;flex-shrink:0}
.badge.done{background:var(--foam);color:var(--deep)}
.badge.wait{background:var(--amberbg);color:var(--amber)}
.badge.alert{background:var(--dangerbg);color:#9C2A20}
.tl{list-style:none;margin:14px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:12px;min-height:58px;position:relative}
.tl li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line);transition:background .5s}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--drop)}
.tl .k{width:30px;height:30px;border-radius:99px;border:1.5px solid var(--line);background:var(--white);display:grid;place-items:center;font-size:12px;color:var(--muted);z-index:1;transition:all .4s var(--ease)}
.tl li.done .k{background:var(--drop);border-color:var(--drop)}
.tl li.done .k::after{content:"";width:10px;height:5.5px;border:2.4px solid var(--white);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tl li.now .k{background:var(--deep);border-color:var(--deep);box-shadow:0 0 0 6px rgba(44,140,192,.16)}
.tl li.now .k::after{content:"";width:9px;height:9px;border-radius:9px;background:var(--white)}
.tl li.done .k span,.tl li.now .k span{display:none}
.tl b{display:block;font-size:15.5px;font-weight:500;color:var(--muted);margin-top:4px}
.tl li.done b,.tl li.now b{color:var(--ink)}
.tl li.now b{font-weight:800}
.tl small{font-size:12px;color:var(--muted)}
.tech{background:var(--mist);border-radius:18px;padding:16px;margin-top:8px}
.tech .who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:46px;height:46px;border-radius:99px;background:var(--foam);color:var(--deep);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.avatar.sm{width:38px;height:38px;font-size:13px}
.banner{position:absolute;left:max(12px,calc(50% - 280px));right:max(12px,calc(50% - 280px));top:10px;z-index:45;background:var(--ink);color:var(--white);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.35;transform:translateY(calc(-100% - 70px));transition:transform .45s var(--ease)}
.banner.show{transform:none}
.banner .d{width:30px;height:30px;border-radius:9px;background:var(--drop);display:grid;place-items:center;flex-shrink:0}

/* service list */
.slist{display:grid;gap:10px}
.scard{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--white);border-radius:16px;padding:14px;display:grid;gap:6px}
.scard:hover{border-color:var(--drop)}
.scard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard b{font-size:15px}
.empty{text-align:center;padding:40px 10px 10px}
.empty p{color:var(--slate);font-size:14.5px;line-height:1.5;margin:12px auto 18px;max-width:420px}

/* details */
.rows{display:grid}
.rows>div{padding:11px 0;border-bottom:1px solid var(--foam);min-width:0}
.rows small{display:block;font-size:11.5px;color:var(--muted)}
.rows b{font-size:15px;overflow-wrap:anywhere}
.qt{background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;font-variant-numeric:tabular-nums}
.qt .r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0}
.qt .r span:first-child{color:var(--slate);min-width:0}
.qt .r span:last-child{white-space:nowrap}
.qt .tot{border-top:1.5px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
.qt .tot span:first-child{color:var(--ink)}

/* chat */
.wachip{margin:12px auto 0;display:table;font-size:11.5px;color:var(--ok);background:var(--okbg);border-radius:99px;padding:5px 12px;font-weight:600;text-decoration:none}
.msgs{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.m{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;animation:pop .28s var(--ease) both;overflow-wrap:anywhere}
.m.t{align-self:flex-start;background:var(--foam);border-bottom-left-radius:6px}
.m.u{align-self:flex-end;background:var(--sea);color:var(--white);border-bottom-right-radius:6px}
.m.bot{background:var(--mist);color:var(--ink);border:1px dashed var(--line)}
.m .tag{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.m small{display:block;font-size:10.5px;opacity:.7;margin-top:4px;text-align:right}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;background:var(--foam);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:9px;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.compose{display:flex;gap:10px;padding-block:10px 16px;padding-inline:var(--gx);border-top:1px solid var(--line);flex-shrink:0;margin:0}
.compose .inp{height:46px;border-radius:99px}
.send{width:46px;height:46px;border-radius:99px;border:0;background:var(--sea);color:var(--white);display:grid;place-items:center;flex-shrink:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding-block:0 8px;padding-inline:var(--gx);flex-shrink:0}
.quick button{white-space:nowrap;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--white);font-size:12.5px;font-weight:600;padding:0 12px;flex-shrink:0}

/* modal sheet */
.sheet{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;opacity:0;transition:opacity .3s}
.sheet.show{opacity:1}
.sheet .card{width:100%;max-width:600px;margin:0 auto;background:var(--white);border-radius:26px 26px 0 0;padding:26px 22px 30px;transform:translateY(40px);transition:transform .4s var(--ease)}
.sheet.show .card{transform:none}
.okmark{width:58px;height:58px;border-radius:99px;background:var(--okbg);display:grid;place-items:center;margin:0 auto 10px}
.okmark::after{content:"";width:20px;height:11px;border:4px solid var(--ok);border-top:0;border-right:0;transform:rotate(-45deg) translate(2px,-2px)}
.sum{background:var(--mist);border-radius:14px;padding:12px 14px;margin:14px 0 16px;font-size:13.5px;line-height:1.6}

/* connection chip (admin) */
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--slate)}
.mode i{width:9px;height:9px;border-radius:99px;background:var(--muted)}
.mode.live i{background:#2FB36B;box-shadow:0 0 0 4px rgba(47,179,107,.18)}
.mode.local i{background:var(--amber)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:rgba(14,42,59,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:min(92vw,900px);max-height:86vh;border-radius:12px;background:var(--white)}

/* ---------- admin panel ---------- */
body.admin-open .wrap{display:none}
.adm{position:fixed;inset:0;z-index:60;background:var(--mist);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "tabs";padding-top:env(safe-area-inset-top,0px)}
.ad-side{display:none}
.ad-top{grid-area:top;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--white);border-bottom:1px solid var(--line)}
.ad-top h1{font-size:18px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.ad-top .brand{display:flex;align-items:center;gap:6px}
.ad-content{grid-area:main;overflow-y:auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.ad-inner{max-width:1160px;margin:0 auto;display:grid;gap:16px;min-width:0}
.ad-tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.ad-tabs button{height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}

      <label class="fl" for="lCel" style="margin-top:18px">Celular</label><input class="inp" id="lCel" inputmode="tel" autocomplete="tel" placeholder="300 000 0000" value="${esc(clientOtp ? clientOtp.cel : '')}" ${clientOtp ? 'readonly' : ''}>
      ${clientOtp ? `<label class="fl" for="lCode">Código de 6 dígitos</label><input class="inp" id="lCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
        <button class="link" id="chgNum" style="padding-left:0">Cambiar el número</button>` : ''}
      <div class="err" id="logErr" hidden></div>
      <p class="small" style="margin-top:12px">Para la demo: celular 300 123 4567 y código 123456. Protegido con reCAPTCHA de Google.</p>
    </div>
    <div class="foot"><button class="btn" id="logOk">${clientOtp ? 'Entrar' : 'Enviarme el código'}</button><button class="btn sec" id="logDemo">Entrar con la cuenta de ejemplo</button>
      <button class="link" data-go="registro" style="justify-self:center">¿No tienes cuenta? Créala</button></div>`,
    init() {
      ['lCel', 'lCode'].forEach(id => { const i = $('#' + id); if (!i) return; i.oninput = e => { e.target.classList.remove('bad'); $('#logErr').hidden = true; }; i.onkeydown = e => { if (e.key === 'Enter') $('#logOk').click(); }; });
      if (clientOtp) setTimeout(() => { const i = $('#lCode'); i && i.focus(); }, 380);
      const cn = $('#chgNum'); if (cn) cn.onclick = () => { clientOtp = null; go('login', 0, false); };
      const done = () => { banner(me() ? 'Sesión iniciada. Hola, ' + first(me().nombre) : 'Celular confirmado. Completa tus datos.'); hist.length = 0; go(!me() ? 'registro' : myServices().length ? 'inicio' : 'reporte'); };
      $('#logOk').onclick = async () => {
        const b = $('#logOk');
        if (!clientOtp) {
          const c = $('#lCel').value;
          if (digits(c).length < 10) return showErr('logErr', 'lCel', 'Escribe un celular de 10 dígitos, por ejemplo 300 123 4567.');
          busy(b, true, 'Enviando código…');
          try { await sendCode(c); clientOtp = { cel: c.trim() }; busy(b, false); go('login', 0, false); } catch (e) { busy(b, false); showErr('logErr', 'lCel', authMsg(e)); }
          return;
        }
        const code = digits($('#lCode').value);
        if (code.length !== 6) return showErr('logErr', 'lCode', 'Escribe los 6 dígitos del código.');
        busy(b, true, 'Verificando…');
        try { await confirmCode(code); clientOtp = null; done(); } catch (e) { busy(b, false); showErr('logErr', 'lCode', authMsg(e)); }
      };
      $('#logDemo').onclick = async () => {
        const b = $('#logDemo'); busy(b, true, 'Entrando…');
        try {
          await sendCode('+573001234567'); await confirmCode('123456'); clientOtp = null;
          if (!me()) await W('set', 'clients/' + AUTH.uid, { nombre: 'Laura Gómez', celular: '300 123 4567', correo: 'laura@correo.com', tipo: 'propietario', edificio: '', creado: Date.now(), demo: true });
          await waitFor(() => me(), 3000); done();
        } catch (e) { busy(b, false); showErr('logErr', null, authMsg(e)); }
      };
    } },

  registro: { name: 'Crear cuenta', html: () => { const u = me(); const r = u || { tipo: L.draft.reg.tipo, nombre: '', celular: AUTH ? prettyPhone(AUTH.phone) : '', correo: '', edificio: '' }; const lockCel = !!(u || AUTH);
    return `${hdr(u ? 'Editar mis datos' : 'Crea tu cuenta')}
    <div class="body">
      <div class="small" style="font-size:13.5px">Así sabremos cómo atenderte.</div>
      <span class="lbl">¿Quién eres?</span>
      <div role="radiogroup" aria-label="Tipo de usuario">
        <button class="opt" role="radio" data-tipo="propietario" aria-checked="${r.tipo !== 'administrador'}"><span class="mk"></span><span><b>Propietario de vivienda</b><span class="s">Casa o apartamento propio</span></span></button>
        <button class="opt" role="radio" data-tipo="administrador" aria-checked="${r.tipo === 'administrador'}"><span class="mk"></span><span><b>Administrador de edificio o conjunto</b><span class="s">Cubiertas, terrazas y zonas comunes</span></span></button>
      </div>
      <span class="lbl">Tus datos</span>
      <label class="fl" for="fNombre" style="margin-top:0">Nombre completo</label><input class="inp" id="fNombre" autocomplete="name" placeholder="Laura Gómez" value="${esc(r.nombre)}">
      <label class="fl" for="fCel">Celular (WhatsApp)</label><input class="inp" id="fCel" inputmode="tel" autocomplete="tel" placeholder="300 000 0000" value="${esc(r.celular)}" ${lockCel ? 'readonly' : ''}>
      ${lockCel ? '<p class="small" style="margin:6px 0 0">Tu celular ya está confirmado e identifica tu cuenta.</p>' : ''}
      <div id="rCodeWrap" hidden><label class="fl" for="rCode">Código de 6 dígitos que te llegó por SMS</label><input class="inp" id="rCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
      <label class="fl" for="fMail">Correo electrónico (opcional)</label><input class="inp" id="fMail" type="email" autocomplete="email" placeholder="laura@correo.com" value="${esc(r.correo)}">
      <div id="edifWrap" ${r.tipo === 'administrador' ? '' : 'hidden'}><label class="fl" for="fEdif">Edificio o conjunto</label><input class="inp" id="fEdif" placeholder="Conjunto Los Pinos" value="${esc(r.edificio)}"></div>
      <div class="err" id="regErr" hidden></div>
      <p class="small" style="margin-top:12px">Usaremos tu celular para confirmar tus citas por WhatsApp.</p>
    </div>
    <div class="foot"><button class="btn" id="regOk">${u ? 'Guardar cambios' : 'Crear cuenta y continuar'}</button></div>`; },
    init() {
      let tipo = (me() || {}).tipo || L.draft.reg.tipo || 'propietario';
      $$('[data-tipo]').forEach(b => b.onclick = () => { tipo = b.dataset.tipo; L.draft.reg.tipo = tipo; $$('[data-tipo]').forEach(x => x.setAttribute('aria-checked', x === b)); $('#edifWrap').hidden = tipo !== 'administrador'; });
      const clear = e => { e.target.classList.remove('bad'); $('#regErr').hidden = true; };
      ['fNombre', 'fCel', 'fMail', 'fEdif', 'rCode'].forEach(id => $('#' + id).addEventListener('input', clear));
      let pending = false; // true once the SMS code was sent and we wait for it
      $('#regOk').onclick = async () => {
        const u = me(), btn = $('#regOk');
        const n = $('#fNombre').value.trim(), c = $('#fCel').value.trim(), m = $('#fMail').value.trim(), e = $('#fEdif').value.trim();
        const bad = [];
        if (n.length < 3) bad.push(['fNombre', 'Escribe tu nombre completo.']);
        if (!AUTH && digits(c).length < 10) bad.push(['fCel', 'Escribe un celular de 10 dígitos, por ejemplo 300 123 4567.']);
        if (m && !/^\S+@\S+\.\S+$/.test(m)) bad.push(['fMail', 'Revisa el correo: debe tener la forma nombre@correo.com.']);
        if (tipo === 'administrador' && !e) bad.push(['fEdif', 'Escribe el nombre del edificio o conjunto.']);
        if (bad.length) { bad.forEach(b => $('#' + b[0]).classList.add('bad')); return showErr('regErr', bad[0][0], bad[0][1]); }
        const data = { nombre: n, correo: m, tipo, edificio: tipo === 'administrador' ? e : '' };
        if (u) { busy(btn, true); const ok = await W('update', 'clients/' + AUTH.uid, data); busy(btn, false); if (!ok) return; banner('Datos guardados'); return hist[hist.length - 1] === 'cuenta' ? back() : go('cuenta', -1, false); }
        // new account: confirm the phone with an SMS code first
        if (!AUTH) {
          if (!pending) {
            busy(btn, true, 'Enviando código…');
            try { await sendCode(c); pending = true; busy(btn, false); btn.textContent = 'Confirmar y crear cuenta'; $('#fCel').readOnly = true; $('#rCodeWrap').hidden = false; $('#rCode').focus(); }
            catch (err) { busy(btn, false); showErr('regErr', 'fCel', authMsg(err)); }
            return;
          }
          const code = digits($('#rCode').value);
          if (code.length !== 6) return showErr('regErr', 'rCode', 'Escribe los 6 dígitos del código.');
          busy(btn, true, 'Verificando…');
          try { await confirmCode(code); } catch (err) { busy(btn, false); return showErr('regErr', 'rCode', authMsg(err)); }
          if (me()) { busy(btn, false); banner('Ya tenías una cuenta con ese celular. Hola, ' + first(me().nombre)); hist.length = 0; return go('inicio'); }
        }
        busy(btn, true);
        const ok = await W('set', 'clients/' + AUTH.uid, Object.assign(data, { celular: prettyPhone(AUTH.phone), creado: Date.now() }));
        busy(btn, false); if (!ok) return;
        await waitFor(() => me(), 3000);
        banner('Cuenta creada. Hola, ' + first(n)); hist.length = 0; go('reporte');
      };
    } },

  reporte: { name: 'Reporte del problema', auth: true, html: () => { const r = L.draft.report;
    return `${hdr('Reporte de problema')}
    <div class="body">${steps(1)}
      <span class="lbl first">Sube fotos del problema</span>
      <div class="upl" id="upl" role="button" tabindex="0" aria-label="Tomar o subir fotos">${ICON.cam}<span>Toca para tomar o subir fotos</span><span class="small">Hasta 3 fotos</span></div>
      <div class="thumbs" id="thumbs"></div>
      <button class="link" id="demoPhotos" style="padding-left:0">Usar fotos de ejemplo</button>
      <span class="lbl">Tipo de problema</span>
      <div class="chips" id="chips">${TYPES.map(t => `<button class="chip" aria-pressed="${r.tipo === t}" data-t="${t}">${t}</button>`).join('')}</div>
      <label class="lbl" for="fDesc">Describe la humedad o filtración</label>
      <textarea class="inp" id="fDesc" maxlength="600" placeholder="Mancha en el techo del baño, gotea cuando llueve.">${esc(r.desc)}</textarea>
      <div class="err" id="repErr" hidden></div>
    </div>
    <div class="foot"><button class="btn" id="repOk">Continuar</button></div>`; },
    init() {
      const r = L.draft.report;
      const open = () => { if (r.photos.length >= 3) return banner('Ya tienes 3 fotos. Quita una para cambiarla.'); $('#fileIn').click(); };
      $('#upl').onclick = open; $('#upl').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
      $('#demoPhotos').onclick = () => { r.photos = [1, 2, 3].map(n => exampleStain(n + Date.now() % 97)); renderThumbs(); $('#repErr').hidden = true; saveL(); };
      $$('#chips .chip').forEach(b => b.onclick = () => { r.tipo = b.dataset.t; $$('#chips .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#repErr').hidden = true; saveL(); });
      $('#fDesc').oninput = e => { r.desc = e.target.value; saveL(); };
      renderThumbs();
      $('#repOk').onclick = () => {
        const err = !r.photos.length ? 'Sube al menos una foto o usa las de ejemplo.' : !r.tipo ? 'Elige el tipo de problema.' : '';

        go('orientacion');
      };
    } },

  orientacion: { name: 'Orientación inicial', auth: true, html: () => { const tipo = L.draft.report.tipo || 'Filtración en techo'; const o = ORIENT[tipo];
    return `${hdr('Orientación inicial')}

    <div class="foot"><button class="btn" data-go="cotizacion">Solicitar cotización</button><button class="btn sec" data-go="chat">Hablar con el equipo</button></div>`; } },

  cotizacion: { name: 'Solicitud de cotización', auth: true, html: () => { const q = L.draft.quote;
    return `${hdr('Solicitud de cotización')}
    <div class="body">${steps(2)}
      <span class="lbl first">Datos de tu inmueble</span>
      <label class="fl" for="fInm" style="margin-top:0">Tipo de inmueble</label>
      <select class="inp" id="fInm">${['Casa', 'Apartamento', 'Local comercial', 'Edificio o conjunto'].map(x => `<option ${q.inmueble === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <label class="fl" for="fDir">Dirección</label><input class="inp" id="fDir" autocomplete="street-address" placeholder="Cra 7 # 45-10, Bogotá" value="${esc(q.direccion)}">

      <div role="radiogroup" aria-label="Tipo de cotización">
        <button class="opt sq" role="radio" data-m="visita" aria-checked="${q.modo === 'visita'}"><span class="mk"></span><span><b>Visita técnica presencial</b><span class="s">Un técnico revisa el sitio y mide</span></span></button>
        <button class="opt sq" role="radio" data-m="linea" aria-checked="${q.modo === 'linea'}"><span class="mk"></span><span><b>Cotización en línea</b><span class="s">Estimado inmediato con tus fotos y el área</span></span></button>

      <div class="err" id="cotErr" hidden></div>
    </div>
    <div class="foot"><button class="btn" id="cotOk">Continuar</button></div>`; },
    init() {
      const q = L.draft.quote;
      const renderEst = () => {
        const box = $('#estimate');
        if (q.modo !== 'linea') { box.innerHTML = ''; return; }
        const c = suggested({ area: q.area, tipo: L.draft.report.tipo }); const t = qTotals(c);
        box.innerHTML = `<div class="qt"><div class="r"><span>Estimado para ${esc(+q.area >= 1 ? q.area : 20)} m²</span><span></span></div><div class="r tot"><span>Total aproximado</span><span>${money(t.total)}</span></div><div class="small" style="margin-top:6px">El equipo revisa el valor final y te lo confirma en la app.</div></div>`;
      };
      $$('#screens [data-m]').forEach(b => b.onclick = () => { q.modo = b.dataset.m; $$('#screens [data-m]').forEach(x => x.setAttribute('aria-checked', x === b)); renderEst(); saveL(); });
      $('#fDir').oninput = e => { q.direccion = e.target.value; e.target.classList.remove('bad'); $('#cotErr').hidden = true; saveL(); };
      $('#fArea').oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 5); q.area = e.target.value; e.target.classList.remove('bad'); $('#cotErr').hidden = true; renderEst(); saveL(); };
      $('#fInm').onchange = e => { q.inmueble = e.target.value; saveL(); };
      renderEst();
      $('#cotOk').onclick = () => {
        if (q.direccion.trim().length < 5) return showErr('cotErr', 'fDir', 'Escribe la dirección completa del inmueble.');
        if (q.modo === 'linea' && !(+q.area >= 1)) return showErr('cotErr', 'fArea', 'Para la cotización en línea escribe el área aproximada.');
        go('agenda');
      };
    } },

  agenda: { name: 'Agendar visita', auth: true, html: () => { const a = L.draft.agenda, linea = L.draft.quote.modo === 'linea';

      <p class="small" style="font-size:14px">${AUTH && !AUTH.isAdmin ? 'Tu número no es del equipo. Entra con un celular del equipo para atender las solicitudes.' : 'Entra con un celular del equipo. Te enviamos un código por SMS.'}</p>
      <label class="fl" for="pinIn">Celular del equipo</label><input class="inp" id="pinIn" inputmode="tel" autocomplete="tel" placeholder="310 555 0000" value="${esc(A.otp ? A.otp.cel : '')}" ${A.otp ? 'readonly' : ''}>

    after() { setTimeout(() => { const i = $(A.otp ? '#codeIn' : '#pinIn'); i && i.focus(); }, 60); } },

  resumen: { title: () => 'Resumen', html: () => {
    const sv = D.services; if (!sv.length) return emptyAdmin();
    const today = iso(today0()), in7 = iso(shiftDays(7));
    const act = sv.filter(s => s.estado < 4);
    const visitas = sv.filter(s => s.fecha && s.fecha >= today && s.fecha <= in7 && s.estado <= 1).sort((a, b) => (a.fecha + a.franja).localeCompare(b.fecha + b.franja));
    const porAprobar = sv.filter(s => s.estado === 2 && s.cotizacion && !s.aprobada);
    const ejec = sv.filter(s => s.estado === 3);
    const aprobado = sv.filter(s => s.aprobada && s.cotizacion).reduce((a, s) => a + qTotals(s.cotizacion).total, 0);
    const pendiente = porAprobar.reduce((a, s) => a + qTotals(s.cotizacion).total, 0);
    const att = [];
    sv.filter(s => s.estado === 2 && s.ajuste && !s.aprobada).forEach(s => att.push({ s, t: `${cliOf(s).nombre} pidió ajustar la cotización`, k: 'u3' }));
    Object.keys(D.chats).filter(unreadAdmin).forEach(k => { const c = D.chats[k], cl = D.clients[k] || {}; att.push({ chat: k, t: `${cl.nombre || 'Cliente'} escribió: «${(c.lastMsg || {}).text || ''}»`, k: 'b' }); });
    act.filter(s => !s.tecnico).forEach(s => att.push({ s, t: `Asignar técnico · ${s.tipo}`, k: 'u2' }));
    sv.filter(s => s.estado <= 1 && s.fecha === today).forEach(s => att.push({ s, t: `Visita hoy ${franjaLbl(s.franja).toLowerCase()} · ${s.direccion}`, k: 'b' }));
    const byState = STATES.map((t, i) => [t, sv.filter(s => s.estado === i).length]);
    return `<div class="tiles">
        <button class="tile" data-a="fest" data-arg="all"><span>Solicitudes activas</span><b class="n">${act.length}</b></button>
        <button class="tile" data-a="nav" data-arg="agenda"><span>Visitas próximos 7 días</span><b class="n">${visitas.length}</b></button>
        <button class="tile ${porAprobar.length ? 'warn' : ''}" data-a="fest" data-arg="cot"><span>Cotizaciones por aprobar</span><b class="n">${porAprobar.length}</b></button>
        <button class="tile" data-a="fest" data-arg="ejec"><span>Obras en ejecución</span><b class="n">${ejec.length}</b></button>
        <div class="tile"><span>Valor aprobado</span><b class="n money">${money(aprobado)}</b></div>
        <div class="tile"><span>En cotizaciones sin aprobar</span><b class="n money">${money(pendiente)}</b></div>
        <button class="tile ${counts().unread ? 'alert' : ''}" data-a="nav" data-arg="mensajes"><span>Chats sin responder</span><b class="n">${counts().unread}</b></button>
        <button class="tile" data-a="nav" data-arg="clientes"><span>Clientes registrados</span><b class="n">${Object.keys(D.clients).length}</b></button>
      </div>
      <div class="cols"><div class="col">
        <div class="ac"><h3 class="ah">Requieren atención</h3>${att.length ? `<div class="alist">${att.slice(0, 8).map(x => x.s
          ? `<button class="arow" data-a="open" data-arg="${x.s._id}"><span class="num">#${x.s.num}</span><span class="grow"><b>${esc(x.t)}</b><span class="small">${esc(cliOf(x.s).nombre)} · ${esc(STATES[x.s.estado])}</span></span>${ICON.chev}</button>`
          : `<button class="arow" data-a="thread" data-arg="${esc(x.chat)}"><span class="dotu"></span><span class="grow"><b>${esc(x.t)}</b><span class="small">${ago((D.chats[x.chat].lastClientAt) || 0)}</span></span>${ICON.chev}</button>`).join('')}</div>${att.length > 8 ? `<p class="small" style="margin:10px 0 0">Y ${att.length - 8} más en Solicitudes y Mensajes.</p>` : ''}` : '<p class="small" style="margin:0">Todo al día. No hay pendientes.</p>'}</div>
      </div><div class="col">
        <div class="ac"><h3 class="ah">Próximas visitas</h3>${visitas.length ? `<div class="alist">${visitas.slice(0, 6).map(s => `<button class="arow" data-a="open" data-arg="${s._id}"><span class="num">#${s.num}</span><span class="grow"><b>${esc(fechaTxt(s.fecha))} · ${franjaLbl(s.franja)}</b><span class="small">${esc(s.direccion)} · ${esc(techName(s.tecnico) || 'Sin técnico')}</span></span>${ICON.chev}</button>`).join('')}</div>` : '<p class="small" style="margin:0">No hay visitas en los próximos 7 días.</p>'}</div>
        <div class="ac"><h3 class="ah">Solicitudes por estado</h3><div class="chips">${byState.map(([t, n], i) => `<span class="pill ${n ? 'b' : 'n'}">${i + 1}. ${t}: ${n}</span>`).join('')}</div></div>
      </div></div>`; } },

  solicitudes: { title: () => 'Solicitudes', html: () => {
    if (!D.services.length) return emptyAdmin();
    const F = A.f;
    const FIL = [['all', 'Todas'], ['visita', 'Por visitar'], ['cot', 'Cotización'], ['ejec', 'En ejecución'], ['fin', 'Finalizadas'], ['alerta', 'Con alertas']];
    return `<div class="toolbar"><div class="two"><input class="inp s" id="fq" type="search" data-m="fq" placeholder="Buscar por #, cliente, dirección…" value="${esc(F.q)}" aria-label="Buscar solicitudes">
        <select class="inp s" id="ft" data-m="ft" aria-label="Tipo de problema"><option value="">Todos los tipos</option>${TYPES.map(t => `<option ${F.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="chips">${FIL.map(([k, t]) => `<button class="chip" data-a="fest" data-arg="${k}" aria-pressed="${F.estado === k}">${t}</button>`).join('')}</div></div>
      <div class="alist" id="slist">${svcListHtml()}</div>`; } },

  solicitud: { title: () => { const s = svcById(A.sel); return s ? `Solicitud #${s.num}` : 'Solicitud'; }, thread: () => { const s = svcById(A.sel); return s ? s.clientKey : null; },
    html: () => {
      const s = svcById(A.sel); if (!s) return '<div class="ac"><p class="small" style="margin:0">Esta solicitud ya no existe.</p></div>';
      const cl = D.clients[s.clientKey] || s.cliente || {}, o = ORIENT[s.tipo] || ORIENT.Otro, c = s.cotizacion;
      if (!A.qd || A.qd.for !== s._id) A.qd = Object.assign(clone(c || suggested(s)), { for: s._id });
      if (!A.vd || A.vd.for !== s._id) A.vd = { for: s._id, tecnico: s.tecnico || '', fecha: s.fecha || '', franja: s.franja || 'manana' };
      if (A.nd === null || A.ndFor !== s._id) { A.nd = s.notas || ''; A.ndFor = s._id; }
      const al = alertsOf(s);
      const nextLbl = s.estado < 4 ? STATES[s.estado + 1] : '';
      return `<div class="ac">
        <div class="ahead"><div style="min-width:0"><span class="small">Creada ${esc(fmtTs(s.creado))} · ${s.modo === 'linea' ? 'Cotización en línea' : 'Visita técnica'}</span><h2 class="ad-h2">${esc(s.tipo)} · ${esc(s.inmueble)}${s.area ? ' · ' + esc(s.area) + ' m²' : ''}</h2>
          <div class="flags"><span class="pill u${o.u}">Urgencia ${URG[o.u].toLowerCase()}</span>${al.map(x => `<span class="pill u3">${x}</span>`).join('')}${unreadAdmin(s.clientKey) ? '<span class="pill u3">Mensaje nuevo</span>' : ''}${s.demo ? '<span class="pill n">Ejemplo</span>' : ''}</div></div>${badgeOf(s)}</div>
        <div class="stepper" role="group" aria-label="Estado">${STATES.map((t, i) => `<button class="stp ${i < s.estado ? 'done' : i === s.estado ? 'now' : ''}" data-a="step" data-arg="${i}" aria-pressed="${i === s.estado}" title="Cambiar a ${t}"><i></i><span>${t}</span></button>`).join('')}</div>
        <div class="btnrow">${s.estado < 4 ? `<button class="btn sm" data-a="step" data-arg="${s.estado + 1}">Pasar a «${nextLbl}»</button>` : ''}${s.estado > 0 ? `<button class="btn sec sm" data-a="step" data-arg="${s.estado - 1}">Volver a «${STATES[s.estado - 1]}»</button>` : ''}</div>
        ${s.estado === 1 && !c ? '<p class="small" style="margin:10px 0 0">Para pasar a «Cotización enviada» primero envía la cotización (más abajo).</p>' : ''}
      </div>
      <div class="cols"><div class="col">
        <div class="ac"><h3 class="ah">Cliente</h3><dl class="kv">
          <dt>Nombre</dt><dd>${esc(cl.nombre)}${cl.tipo === 'administrador' ? ` <span class="pill b">Admin. ${esc(cl.edificio)}</span>` : ''}</dd>
          <dt>Celular</dt><dd>${esc(cl.celular)}<button class="copy" data-a="copy" data-arg="${esc(cl.celular)}">Copiar</button></dd>
          ${cl.correo ? `<dt>Correo</dt><dd>${esc(cl.correo)}</dd>` : ''}
          <dt>Dirección</dt><dd>${esc(s.direccion)}</dd></dl>
          <div class="btnrow"><a class="btn wa sm" href="${waLink(cl.celular, `Hola ${first(cl.nombre)}, te escribe el equipo de ImpermeApp por tu servicio #${s.num}.`)}" target="_blank" rel="noopener">WhatsApp ↗</a><button class="btn sec sm" data-a="client" data-arg="${esc(s.clientKey)}">Ver ficha del cliente</button></div></div>
        <div class="ac"><h3 class="ah">Problema reportado</h3>
          <p style="margin:0 0 4px;font-size:14.5px;line-height:1.5">${s.desc ? esc(s.desc) : '<span class="small">Sin descripción.</span>'}</p>
          <p class="small" style="margin:0">Orientación automática: ${esc(o.c)}</p>
          <div class="thumbs" id="adPhotos">${s.fotos ? Array.from({ length: Math.min(3, s.fotos) }, () => `<div class="th">${ICON.img}</div>`).join('') : '<span class="small">El cliente no subió fotos.</span>'}</div></div>
        <div class="ac"><h3 class="ah">Visita y técnico</h3>
          <label class="fl" for="vTec" style="margin-top:0">Técnico asignado</label>
          <select class="inp s" id="vTec" data-m="vtec"><option value="">Sin asignar</option>${D.team.filter(t => t.activo || t.id === A.vd.tecnico).map(t => `<option value="${esc(t.id)}" ${A.vd.tecnico === t.id ? 'selected' : ''}>${esc(t.nombre)} · ${esc(t.esp)}</option>`).join('')}</select>
          <div class="two"><div><label class="fl" for="vFecha">Fecha</label><input class="inp s" type="date" id="vFecha" data-m="vfecha" value="${esc(A.vd.fecha)}"></div>
            <div><label class="fl" for="vFranja">Franja</label><select class="inp s" id="vFranja" data-m="vfranja"><option value="manana" ${A.vd.franja !== 'tarde' ? 'selected' : ''}>Mañana · 8–12</option><option value="tarde" ${A.vd.franja === 'tarde' ? 'selected' : ''}>Tarde · 1–5</option></select></div></div>
          <p class="small" id="vWarn" style="margin:8px 0 0">${visitWarn(s)}</p>
          <div class="btnrow"><button class="btn sm" data-a="savevisit">Guardar y avisar al cliente</button></div></div>
      </div><div class="col">
        <div class="ac"><h3 class="ah">Cotización</h3>
          <p class="small" style="margin:0 0 10px">${c ? `Versión ${esc(c.version || 1)} enviada ${esc(fmtTs(c.enviada))}${c.auto ? ' (estimado automático)' : ''} · ${s.aprobada ? '<b style="color:var(--ok)">Aprobada por el cliente</b>' : s.ajuste ? '<b style="color:var(--danger)">El cliente pidió un ajuste</b>' : 'Esperando aprobación'}` : 'Aún no se ha enviado. Ajusta los valores y envíala.'}</p>
          <div id="qEditor">${quoteEditor()}</div>
          <div class="btnrow"><button class="btn sm" data-a="qsend">${c ? 'Enviar nueva versión' : 'Enviar cotización al cliente'}</button><button class="btn sec sm" data-a="qsug">Usar valores sugeridos</button></div></div>
        <div class="ac"><h3 class="ah">Conversación con ${esc(first(cl.nombre))}</h3>${chatBlock()}</div>
        <div class="ac"><h3 class="ah">Notas internas</h3><label class="fl" for="nTxt" style="margin-top:0">Solo las ve el equipo</label>
          <textarea class="inp s" id="nTxt" data-m="notes" maxlength="2000" placeholder="Ej.: llevar escalera de 6 m, portería pide cédula.">${esc(A.nd)}</textarea>
          <div class="btnrow"><button class="btn sec sm" data-a="savenotes">Guardar notas</button><button class="btn danger sm" data-a="delsvc" data-confirm="Toca otra vez para eliminar">Eliminar solicitud</button></div></div>
      </div></div>`; },
    after() { const s = svcById(A.sel); if (!s) return; renderAdMsgs(); markSeen(s.clientKey, 'adminSeenAt'); if (s.fotos) loadPhotos(s._id).then(list => { const b = $('#adPhotos'); if (b && A.sel === s._id && list.length) b.innerHTML = list.map((p, i) => `<button class="th" data-a="zoom" data-arg="${i}" aria-label="Ampliar foto ${i + 1}"><img src="${esc(p)}" alt="Foto ${i + 1} del daño"></button>`).join(''); }); } },

  mensajes: { title: () => 'Mensajes', html: () => {
    const keys = Object.keys(D.chats).filter(k => D.chats[k].lastMsg).sort((a, b) => (D.chats[b].lastMsg.ts || 0) - (D.chats[a].lastMsg.ts || 0));
    if (!keys.length) return '<div class="ac empty"><p>Aún no hay conversaciones. Cuando un cliente escriba desde la app aparecerá aquí.</p></div>';
    return `<div class="alist">${keys.map(k => { const c = D.chats[k], cl = D.clients[k] || {}, un = unreadAdmin(k);
      return `<button class="arow" data-a="thread" data-arg="${k}"><span class="avatar sm">${esc(initials(cl.nombre))}</span><span class="grow"><b>${esc(cl.nombre || 'Cliente')}</b><span class="small">${c.lastMsg.who === 'u' ? '' : c.lastMsg.who === 'b' ? 'Automática: ' : 'Tú: '}${esc(c.lastMsg.text)}</span></span><span class="end"><span class="small">${ago(c.lastMsg.ts)}</span>${un ? '<span class="dotu" aria-label="Sin leer"></span>' : ''}</span></button>`; }).join('')}</div>`; } },

  hilo: { title: () => (D.clients[A.chatKey] || {}).nombre || 'Conversación', thread: () => A.chatKey, html: () => {
    const cl = D.clients[A.chatKey] || {}; const sv = D.services.filter(s => s.clientKey === A.chatKey).sort((a, b) => b.num - a.num);
    return `<div class="cols"><div class="col"><div class="ac">${chatBlock()}</div></div><div class="col">
      <div class="ac"><h3 class="ah">Cliente</h3><dl class="kv"><dt>Nombre</dt><dd>${esc(cl.nombre)}</dd><dt>Celular</dt><dd>${esc(cl.celular)}<button class="copy" data-a="copy" data-arg="${esc(cl.celular)}">Copiar</button></dd>${cl.edificio ? `<dt>Edificio</dt><dd>${esc(cl.edificio)}</dd>` : ''}</dl>
        <div class="btnrow"><a class="btn wa sm" href="${waLink(cl.celular, `Hola ${first(cl.nombre)}, te escribe el equipo de ImpermeApp.`)}" target="_blank" rel="noopener">WhatsApp ↗</a></div></div>
      <div class="ac"><h3 class="ah">Sus solicitudes</h3>${sv.length ? `<div class="alist">${sv.map(rowSvc).join('')}</div>` : '<p class="small" style="margin:0">Sin solicitudes todavía.</p>'}</div></div></div>`; },
    after() { renderAdMsgs(); markSeen(A.chatKey, 'adminSeenAt'); } },

  agenda: { title: () => 'Agenda', html: () => {
    const base = today0(), m = new Date(base.getFullYear(), base.getMonth() + A.calOff, 1);
    const y = m.getFullYear(), mo = m.getMonth(), days = new Date(y, mo + 1, 0).getDate(), f0 = (m.getDay() + 6) % 7;
    const sel = A.calDay || iso(base);
    let cells = ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do'].map(d => `<span class="dn">${d}</span>`).join('') + '<span></span>'.repeat(f0);
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y, mo, d), k = iso(dt), n = D.services.filter(s => s.fecha === k && s.estado < 4).length, full = n >= cupos() * 2;
      cells += `<button class="aday ${!workDay(dt) ? 'off' : ''} ${blocked(k) ? 'blk' : ''} ${sel === k ? 'sel' : ''} ${k === iso(base) ? 'today' : ''}" data-a="day" data-arg="${k}" aria-label="${fechaTxt(k)}${n ? ', ' + n + ' visitas' : ''}"><b>${d}</b>${n ? `<em class="${full ? 'full' : ''}">${n}</em>` : ''}</button>`;
    }
    const dd = fromIso(sel), dayV = D.services.filter(s => s.fecha === sel).sort((a, b) => a.franja.localeCompare(b.franja));
    const upcoming = D.services.filter(s => s.fecha && s.fecha >= iso(base) && s.fecha <= iso(shiftDays(14)) && s.estado <= 1).sort((a, b) => (a.fecha + a.franja).localeCompare(b.fecha + b.franja));
    return `<div class="cols"><div class="col"><div class="ac">
        <div class="ahead" style="align-items:center"><h3 class="ah" style="margin:0">${monthTxt(m)}</h3>
          <span class="calnav"><button class="ib" data-a="cal" data-arg="-1" ${A.calOff <= 0 ? 'disabled' : ''} aria-label="Mes anterior">${ICON.prev}</button><button class="ib" data-a="cal" data-arg="1" ${A.calOff >= 2 ? 'disabled' : ''} aria-label="Mes siguiente">${ICON.chev}</button></span></div>
        <div class="acal" style="margin-top:10px">${cells}</div>
        <div class="legend"><span><i style="background:var(--sea)"></i>Visitas del día</span><span><i style="background:var(--amber)"></i>Día lleno</span><span><i style="background:repeating-linear-gradient(135deg,var(--mist) 0 3px,var(--foam) 3px 6px);border:1px solid var(--line)"></i>Bloqueado</span></div>
        <p class="small" style="margin:8px 0 0">Cupo: ${cupos()} visitas por franja. Lo que bloquees aquí deja de aparecer disponible en la app del cliente.</p></div></div>
      <div class="col"><div class="ac"><h3 class="ah" style="text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)">${esc(dd.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }))}</h3>
        <p class="small" style="margin:-4px 0 12px">${!workDay(dd) ? 'Día no laborable (se cambia en Configuración).' : blocked(sel) ? 'Bloqueado: los clientes no pueden agendar este día.' : `Mañana ${usedSlots(sel, 'manana')}/${cupos()} · Tarde ${usedSlots(sel, 'tarde')}/${cupos()}`}</p>
        ${dayV.length ? `<div class="alist">${dayV.map(s => `<button class="arow" data-a="open" data-arg="${s._id}"><span class="num">#${s.num}</span><span class="grow"><b>${franjaLbl(s.franja)} · ${esc(cliOf(s).nombre)}</b><span class="small">${esc(s.direccion)} · ${esc(techName(s.tecnico) || 'Sin técnico')}</span></span>${badgeOf(s)}</button>`).join('')}</div>` : '<p class="small" style="margin:0">Sin visitas este día.</p>'}
        ${workDay(dd) && sel > iso(base) ? `<div class="btnrow"><button class="btn ${blocked(sel) ? '' : 'sec'} sm" data-a="block" data-arg="${sel}">${blocked(sel) ? 'Desbloquear este día' : 'Bloquear este día'}</button></div>` : ''}</div>
      <div class="ac"><h3 class="ah">Próximas 2 semanas</h3>${upcoming.length ? `<div class="alist">${upcoming.map(s => `<button class="arow" data-a="open" data-arg="${s._id}"><span class="num">#${s.num}</span><span class="grow"><b>${esc(fechaTxt(s.fecha))} · ${franjaLbl(s.franja)}</b><span class="small">${esc(cliOf(s).nombre)} · ${esc(techName(s.tecnico) || 'Sin técnico')}</span></span>${ICON.chev}</button>`).join('')}</div>` : '<p class="small" style="margin:0">No hay visitas agendadas.</p>'}</div></div></div>`; } },

  clientes: { title: () => 'Clientes', html: () => {
    if (!Object.keys(D.clients).length) return '<div class="ac empty"><p>Aún no hay clientes. Se registran desde la app al crear su cuenta.</p></div>';
    return `<input class="inp s" type="search" id="cq" data-m="cq" placeholder="Buscar por nombre, celular o edificio" value="${esc(A.cq)}" aria-label="Buscar clientes">
      <div class="alist" id="clist">${clientListHtml()}</div>`; } },

  cliente: { title: () => (D.clients[A.client] || {}).nombre || 'Cliente', html: () => {
    const c = D.clients[A.client]; if (!c) return '<div class="ac"><p class="small" style="margin:0">Este cliente ya no existe.</p></div>';
    const sv = D.services.filter(s => s.clientKey === A.client).sort((a, b) => b.num - a.num);
    const total = sv.filter(s => s.aprobada && s.cotizacion).reduce((a, s) => a + qTotals(s.cotizacion).total, 0);

/* ---------- live updates ---------- */
let prevSvc = null, prevChats = null, started = false;
function detectChanges() {
  const map = {}; D.services.forEach(s => { map[s._id] = s; });
  if (prevSvc && started) {
    const admin = isAdminOpen();
    for (const s of D.services) {
      const p = prevSvc[s._id], mine = LOCALW[s._id] !== undefined && s.updated === LOCALW[s._id];
      if (admin) {
        if (!p) { if (LOCALW[s._id] === undefined) toast(`Nueva solicitud #${s.num} de ${cliOf(s).nombre}: ${s.tipo}.`); continue; }
        if (mine) continue;
        if (!p.aprobada && s.aprobada) toast(`${cliOf(s).nombre} aprobó la cotización #${s.num}.`);
        if (!p.ajuste && s.ajuste) toast(`${cliOf(s).nombre} pidió ajustar la cotización #${s.num}.`);
      } else if (p && s.clientKey === L.clientKey && !mine) {
        if (p.estado !== s.estado) banner(`Tu servicio #${s.num} ahora está en: ${STATES[s.estado]}`);
        else if ((p.cotizacion || {}).enviada !== (s.cotizacion || {}).enviada && s.cotizacion) banner(`Recibiste la cotización del servicio #${s.num}`);
        else if (p.tecnico !== s.tecnico && s.tecnico) banner(`${techName(s.tecnico)} será tu técnico en el servicio #${s.num}`);
        else if (p.fecha !== s.fecha || p.franja !== s.franja) banner(`Tu cita del servicio #${s.num} cambió: ${visitTxt(s)}`);
      }
    }
  }
  prevSvc = map;
}
function detectChats() {
  if (prevChats && started && !seeding) {
    for (const k in D.chats) {
      const c = D.chats[k], p = prevChats[k] || {};

      else if (k === L.clientKey && (c.lastTeamAt || 0) > (p.lastTeamAt || 0) && cur !== 'chat') banner('Nuevo mensaje del equipo: ' + ((c.lastMsg || {}).text || ''));
    }

let clientRaf = 0;

    clientRaf = 0;
    if (cur === 'agenda') renderCal();

  });
}

}
let gotData = {};
const arrived = kind => { gotData[kind] = true; };
const dataLoaded = () => gotData.services && gotData.clients && gotData.chats && gotData.config;
// A snapshot marked fromCache is not final yet: it never decides "this account/settings doesn't exist".
const definitive = meta => !meta || !meta.fromCache;
// What each person may read depends on who signed in, so subscriptions are rebuilt on every sign-in/out:
// signed out = only settings; client = own requests, account and chat; team = everything.
let SUBS = [];
function subscribeAll() {
  SUBS.forEach(u => { try { u(); } catch (e) {} }); SUBS = [];
  gotData = {}; prevSvc = null; prevChats = null;
  D.services = []; D.clients = {}; D.chats = {}; D.ocupacion = [];
  const uid = AUTH && AUTH.uid, team = !!(AUTH && AUTH.isAdmin), all = {};
  SUBS.push(Store.watch('config', (docs, meta) => {
    const s = docs.find(d => d._id === 'settings'), t = docs.find(d => d._id === 'team');
    D.settingsDoc = definitive(meta) ? !!s : D.settingsDoc || !!s; D.settings = Object.assign(clone(DEF_SETTINGS), s ? clone(s) : {}); D.settings.precios = Object.assign(clone(DEF_SETTINGS.precios), (s && s.precios) || {}); delete D.settings._id;
    D.teamDoc = !!t; D.team = t && Array.isArray(t.list) ? clone(t.list).filter(x => x && x.id && x.nombre) : clone(DEF_TEAM);
    if (definitive(meta)) arrived('config'); dataChanged('config');
  }));
  if (!uid && Store.mode === 'firebase') { arrived('services'); arrived('clients'); arrived('chats'); dataChanged('services'); return; }
  SUBS.push(Store.watch('services', (docs, meta) => { D.services = docs.filter(d => d && typeof d.num === 'number' && Number.isInteger(d.estado) && d.estado >= 0 && d.estado <= 4 && d.cliente && d.clientKey).sort((a, b) => a.num - b.num); if (definitive(meta)) arrived('services'); dataChanged('services'); }, team ? all : { where: ['clientKey', '==', uid] }));
  SUBS.push(Store.watch('clients', (docs, meta) => { D.clients = Object.fromEntries(docs.filter(d => d && d.nombre).map(d => [d._id, d])); if (definitive(meta)) arrived('clients'); dataChanged('clients'); }, team ? all : { id: uid }));
  SUBS.push(Store.watch('chats', (docs, meta) => { D.chats = Object.fromEntries(docs.map(d => [d._id, d])); if (definitive(meta)) arrived('chats'); dataChanged('chats'); }, team ? all : { id: uid }));

// Sign-in or sign-out: rebuild who sees what and refresh whatever is on screen.
function onAuth(u) {

/* ---------- boot ---------- */
(async function boot() {
